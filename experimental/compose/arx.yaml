# EXPERIMENT: arx RDMA all-reduce for decode-sized TP all-reduces (see arx.py),
# and with VLLM_ARXBIG=1 arxbig.cu's all-gather for prefill-sized SP gathers.
#   docker compose -f compose/glm53.yaml -f compose/arx.yaml up -d
services:
  glm53:
    volumes:
      - /home/admin/arx-vllm/arx.py:/usr/local/lib/python3.12/dist-packages/vllm/distributed/device_communicators/arx.py:ro
      - /home/admin/arx-vllm/arx_vllm.cu:/usr/local/lib/python3.12/dist-packages/vllm/distributed/device_communicators/arx_vllm.cu:ro
      - /home/admin/arx-vllm/arxbig.cu:/usr/local/lib/python3.12/dist-packages/vllm/distributed/device_communicators/arxbig.cu:ro
      - /home/admin/arx-vllm/cuda_communicator.py:/usr/local/lib/python3.12/dist-packages/vllm/distributed/device_communicators/cuda_communicator.py:ro
    environment:
      - VLLM_ARX_ALLREDUCE=1
      - VLLM_ARXBIG=${VLLM_ARXBIG:-1}
      - VLLM_ARXBIG_RS=${VLLM_ARXBIG_RS:-1}
