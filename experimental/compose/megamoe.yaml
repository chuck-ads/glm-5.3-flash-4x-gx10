# megamoe for decode-sized MoE batches (W4A16, CUTLASS's own tensors); CUTLASS keeps prefill.
# Needs snapshot.yaml's loader, which calls megamoe_vllm.install() after loading.
services:
  glm53:
    volumes:
      - ../experimental/megamoe/megamoe_rm.cu:/opt/megamoe/megamoe_rm.cu:ro
      - ../experimental/megamoe/megamoe_vllm.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/fused_moe/megamoe_vllm.py:ro
    environment:
      - VLLM_MEGAMOE=1
      - VLLM_MEGAMOE_MAX_TOKENS=${VLLM_MEGAMOE_MAX_TOKENS:-8}
      - VLLM_MEGAMOE_VARIANT=${VLLM_MEGAMOE_VARIANT:-20}
